<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claude-voice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%237fe0d0' stroke-width='2'/%3E%3Cpath d='M16 6l4 10-4 10-4-10z' fill='%237fe0d0'/%3E%3C/svg%3E">
<style>
/* ==================================================================
   claude-voice — jarvis-ui radial.html の設計言語を継承。
   中央=3Dラジアルコア(声で脈動)、下部=コンソール(音声/テキスト指示)、
   右=PROJECTS/TASKS パネル。
   ================================================================== */
:root {
  --void: #04060b;
  --hairline: rgba(205, 227, 235, 0.14);
  --hairline-strong: rgba(205, 227, 235, 0.32);
  --teal: #7fe0d0;
  --indigo: #7d89e8;
  --violet: #9c7fe0;
  --gold: #e7c383;
  --ice: #dce8ee;
  --dim: rgba(216, 230, 236, 0.5);
  --faint: rgba(216, 230, 236, 0.3);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas,
           "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN",
           "Yu Mincho", Georgia, serif;
  --sans: -apple-system, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--void); overflow: hidden; font-family: var(--sans); }
#scene { position: fixed; inset: 0; display: block; }

.hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px; }

/* ---- masthead ---- */
.masthead { text-align: center; margin-top: 4px; }
.eyebrow { margin: 0 0 14px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.32em; color: var(--faint); text-transform: uppercase; }
.masthead h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 4vw, 40px); letter-spacing: 0.01em; color: var(--ice); text-shadow: 0 0 22px rgba(127, 224, 208, 0.25); }
.status { margin: 10px 0 0; font-family: var(--mono); font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--faint); transition: color 0.4s ease, text-shadow 0.4s ease; }
.status.active { color: var(--gold); text-shadow: 0 0 12px rgba(231, 195, 131, 0.6); }

/* ---- console ---- */
.console { pointer-events: auto; width: min(600px, 92vw); }

/* 会話ログ: コンソールの上に最新のやり取りを重ねる(上端はフェードで消える) */
#log { max-height: 176px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px;
  mask-image: linear-gradient(to bottom, transparent, #000 22%);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22%);
  scrollbar-width: none; }
#log::-webkit-scrollbar { display: none; }
.line { display: flex; gap: 10px; margin-top: 9px; font-size: 13px; line-height: 1.7; animation: line-in 0.4s ease both; }
@keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.line .pfx { font-family: var(--mono); font-size: 11px; flex: none; padding-top: 2px; }
.line .body { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.line.user .pfx { color: var(--teal); }
.line.user .body { color: var(--dim); }
.line.assistant .pfx { color: var(--indigo); }
.line.assistant .body { color: var(--ice); }
.line.system { font-size: 11px; }
.line.system .pfx { color: var(--gold); opacity: 0.7; }
.line.system .body { color: var(--faint); font-family: var(--mono); letter-spacing: 0.04em; }

.console-input { display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--hairline); padding-bottom: 10px; }
.prompt { font-family: var(--mono); font-size: 14px; color: var(--teal); line-height: 1.6; opacity: 0.8; }
#cmd { flex: 1; resize: none; background: transparent; border: none; color: var(--ice); font-family: var(--sans); font-size: 14px; line-height: 1.6; padding: 0; outline: none; overflow: hidden; }
#cmd::placeholder { color: var(--faint); }
#interim { font-family: var(--sans); font-size: 13px; color: var(--faint); font-style: italic; padding: 4px 0 0 24px; min-height: 0; }

/* ---- oscilloscope ---- */
.scope { position: relative; margin-top: 14px; height: 40px; border-bottom: 1px solid var(--hairline); }
#wave { display: block; width: 100%; height: 40px; }
.scope-readout { position: absolute; right: 0; bottom: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--faint); }

/* ---- controls ---- */
.controls { display: flex; gap: 22px; margin-top: 16px; align-items: center; }
.ctl { position: relative; display: inline-flex; align-items: center; gap: 7px; background: none; border: none; padding: 6px 0; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; cursor: pointer; transition: color 0.2s ease; }
.ctl::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px; background: var(--teal); transition: right 0.25s ease; }
.ctl:hover { color: var(--ice); }
.ctl:hover::after { right: 0; }
.ctl.on { color: var(--gold); }
.ctl.on::after { right: 0; background: var(--gold); }
.ctl.on span::before { content: attr(data-active-label); }
.ctl.on span { font-size: 0; }
.ctl.on span::before { font-size: 11px; }
.ctl-quiet { margin-left: auto; color: var(--faint); font-size: 10px; }
.ctl svg { opacity: 0.8; }

/* ---- HUD corner brackets ---- */
.hud-corner { position: absolute; width: 22px; height: 22px; border: 1px solid var(--hairline-strong); }
.hud-corner.tl { top: 26px; left: 26px; border-right: none; border-bottom: none; }
.hud-corner.tr { top: 26px; right: 26px; border-left: none; border-bottom: none; }
.hud-corner.bl { bottom: 26px; left: 26px; border-right: none; border-top: none; }
.hud-corner.br { bottom: 26px; right: 26px; border-left: none; border-top: none; }

/* ---- right-side panels (tuner + ops) ---- */
.tuner { position: fixed; top: 96px; right: 26px; z-index: 10; width: 216px; padding: 12px 14px;
  background: rgba(6, 16, 32, 0.55); border: 1px solid rgba(93, 195, 255, 0.25); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: var(--mono); color: var(--dim); }
.tuner-title { margin: 0 0 10px; font-size: 9px; letter-spacing: 0.3em; color: var(--faint); }

/* ---- side panels: PROJECTS(左) / TASKS(右) ---- */
#panel-projects { left: 26px; right: auto; top: 96px; max-height: calc(100vh - 140px); overflow-y: auto; scrollbar-width: none; }
#panel-projects::-webkit-scrollbar { display: none; }
#panel-tasks { top: 340px; width: 268px; max-height: calc(100vh - 380px); overflow-y: auto; scrollbar-width: none; }
#panel-tasks::-webkit-scrollbar { display: none; }
.tuner.flash { animation: panelflash 0.9s ease-out; }
@keyframes panelflash { 0% { border-color: var(--teal); box-shadow: 0 0 20px rgba(127, 224, 208, 0.3); } }
.ptitle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ptitle-row .tuner-title { margin: 0; }
.padd { background: none; border: 1px solid rgba(93, 195, 255, 0.25); border-radius: 5px; color: var(--faint); font-family: var(--mono); font-size: 11px; width: 20px; height: 18px; line-height: 1; cursor: pointer; padding: 0; }
.padd:hover { color: var(--teal); border-color: var(--teal); }
#newtask { display: none; margin-bottom: 8px; }
#newtask.show { display: block; }
#newtask input, .tform input { width: 100%; background: rgba(2, 8, 18, 0.6); border: 1px solid var(--hairline); border-radius: 5px; color: var(--ice); font-family: var(--sans); font-size: 11px; padding: 5px 7px; outline: none; }
#newtask input:focus, .tform input:focus { border-color: rgba(127, 224, 208, 0.5); }
.prj { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; padding: 5px 2px; color: var(--dim); font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; cursor: pointer; text-align: left; }
.prj:hover { color: var(--ice); }
.prj .mk { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); flex: none; }
.prj.run .mk { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.prj.active { color: var(--teal); }
.prj.active .mk { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
.prj .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prj .ct { color: var(--faint); font-size: 9px; }
.none { font-size: 10px; color: var(--faint); margin: 0; font-family: var(--mono); }
.tk { padding: 2px 0; cursor: pointer; }
.tk-row { display: flex; align-items: baseline; gap: 7px; padding: 4px 2px; color: var(--dim); font-family: var(--mono); font-size: 10px; }
.tk:hover .tk-row, .tk.sel .tk-row { color: var(--ice); }
.tk .st { flex: none; width: 10px; }
.tk .st.running { color: var(--gold); animation: blink 1.4s infinite; }
.tk .st.queued { color: var(--faint); }
.tk .st.succeeded { color: var(--teal); }
.tk .st.failed { color: #e88a7d; }
.tk .st.cancelled { color: var(--faint); }
@keyframes blink { 50% { opacity: 0.35; } }
.tk .seq { color: var(--faint); flex: none; }
.tk .ti { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--sans); font-size: 11px; }
.tk .urg { flex: none; color: var(--gold); border: 1px solid rgba(231, 195, 131, 0.5); border-radius: 6px; font-size: 8px; padding: 0 4px; }
.tk .rev { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); align-self: center; }
.tkd { margin: 2px 0 8px 17px; padding: 7px 0 2px; border-top: 1px dashed var(--hairline); }
.tkd .meta { margin: 0 0 5px; font-family: var(--mono); font-size: 9px; color: var(--faint); letter-spacing: 0.04em; }
.tkd .out { margin: 0 0 6px; font-size: 11px; line-height: 1.6; color: var(--dim); white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow-y: auto; scrollbar-width: none; }
.tkd .out::-webkit-scrollbar { display: none; }
.tkd .tools { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.tkd .tools span { font-family: var(--mono); font-size: 9px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.tkd .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn { background: none; border: 1px solid rgba(93, 195, 255, 0.25); border-radius: 5px; color: var(--dim); font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; padding: 4px 8px; cursor: pointer; }
.tbtn:hover { color: var(--teal); border-color: var(--teal); }
.tbtn.danger:hover { color: #e88a7d; border-color: #e88a7d; }
.tform { margin-top: 6px; }

@media (max-width: 900px) { .tuner { display: none; } }
@media (max-width: 560px) { .hud { padding: 22px; } .controls { flex-wrap: wrap; gap: 16px; } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <header class="masthead">
      <p class="eyebrow" id="sys-line">SYS.CV&nbsp;/&nbsp;JA-JP&nbsp;/&nbsp;IDLE</p>
      <h1>claude-voice</h1>
      <p class="status" id="status">standby</p>
    </header>

    <main class="console">
      <div id="log"></div>
      <div class="console-input">
        <span class="prompt">&gt;</span>
        <textarea id="cmd" rows="1" placeholder="話しかけるか、指示を入力… (Enterで送信)"></textarea>
      </div>
      <div id="interim"></div>

      <div class="scope">
        <canvas id="wave" width="600" height="40"></canvas>
        <span class="scope-readout" id="level-readout">LVL 000</span>
      </div>

      <div class="controls">
        <button id="btn-mic" class="ctl">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          <span data-active-label="聴音中…">マイク入力</span>
        </button>
        <button id="btn-send" class="ctl">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          <span data-active-label="送信中…">送信</span>
        </button>
        <button id="btn-tts" class="ctl on">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2.5-4.03v8.05c1.73-.74 2.5-2.25 2.5-4.02z"/></svg>
          <span data-active-label="読み上げ ON">読み上げ OFF</span>
        </button>
        <button id="btn-stop" class="ctl ctl-quiet"><span>停止</span></button>
      </div>
    </main>
  </div>

  <aside class="tuner" id="panel-projects" aria-label="プロジェクト">
    <p class="tuner-title">PROJECTS</p>
    <div id="projects-list"></div>
  </aside>

  <aside class="tuner" id="panel-tasks" aria-label="タスク">
    <div class="ptitle-row">
      <p class="tuner-title">TASKS</p>
      <button class="padd" id="task-add" title="新しいタスクを開始">＋</button>
    </div>
    <div id="newtask"><input placeholder="新しいタスクの指示… (Enter)" aria-label="新しいタスクの指示"></div>
    <div id="tasks-list"></div>
  </aside>

  <script src="./cv-intent.js"></script>
  <script type="module">
  import * as THREE from "./vendor/three.module.js";
  "use strict";

  const $ = (s) => document.querySelector(s);
  const canvas = $("#scene");
  const waveCanvas = $("#wave"), waveCtx = waveCanvas.getContext("2d");
  const statusEl = $("#status"), sysLineEl = $("#sys-line"), levelReadoutEl = $("#level-readout");
  const logEl = $("#log"), cmdEl = $("#cmd"), interimEl = $("#interim");
  const btnMic = $("#btn-mic"), btnSend = $("#btn-send"), btnTts = $("#btn-tts"), btnStop = $("#btn-stop");

  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* =================================================================
     3D scene — jarvis-ui radial.js のラジアル・ダイヤルをそのまま継承
     ================================================================= */
  const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(DPR);
  renderer.setClearColor(0x02040a, 1);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x02040a, 0.008);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
  camera.position.set(0, 7, 46);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.HemisphereLight(0xdfeaff, 0x1a2340, 0.7));
  const coreLight = new THREE.PointLight(0xbfe8ff, 900, 0, 2);
  scene.add(coreLight);

  const dial = new THREE.Group();
  dial.rotation.x = -Math.PI / 2;
  scene.add(dial);

  const TEAL = new THREE.Color(0x7fe0d0);
  const INDIGO = new THREE.Color(0x7d89e8);
  const VIOLET = new THREE.Color(0x9c7fe0);

  const ringDefs = [
    { r: 7.5, z: 2.4, tube: 0.09, col: TEAL, segs: null, speed: 0.10, alpha: 0.5 },
    { r: 10.0, z: 1.6, tube: 0.22, col: TEAL, segs: [[0.05, 0.40], [0.55, 0.95]], speed: -0.18, alpha: 1.0 },
    { r: 12.6, z: 0.8, tube: 0.07, col: INDIGO, segs: null, speed: 0.13, alpha: 0.4 },
    { r: 15.4, z: 0.0, tube: 0.17, col: INDIGO, segs: [[0.10, 0.85]], speed: -0.09, alpha: 0.85 },
    { r: 18.2, z: -0.8, tube: 0.07, col: VIOLET, segs: null, speed: 0.06, alpha: 0.35 },
    { r: 20.6, z: -1.6, tube: 0.15, col: VIOLET, segs: [[0.0, 0.30], [0.45, 0.60], [0.70, 1.0]], speed: -0.045, alpha: 0.75 },
  ];
  const spinners = [], ringMats = [];
  for (const def of ringDefs) {
    const holder = new THREE.Group();
    holder.position.z = def.z;
    dial.add(holder);
    spinners.push({ obj: holder, speed: def.speed });
    const mat = new THREE.MeshBasicMaterial({ color: def.col.clone(), transparent: true, opacity: def.alpha });
    ringMats.push({ mat, base: def.col.clone(), alpha: def.alpha });
    for (const [s0, s1] of (def.segs || [[0, 1]])) {
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(def.r, def.tube, 10, 120, (s1 - s0) * TAU), mat);
      mesh.rotation.z = s0 * TAU;
      holder.add(mesh);
    }
  }
  { // tick bezel
    const ticks = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.10, 0.9, 0.10),
      new THREE.MeshBasicMaterial({ color: 0xdce8ee, transparent: true, opacity: 0.35 }), 72);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), eul = new THREE.Euler();
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * TAU, major = i % 6 === 0, r = 16.6;
      eul.set(0, 0, a); q.setFromEuler(eul);
      m.compose(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0), q, new THREE.Vector3(1, major ? 1.6 : 0.8, 1));
      ticks.setMatrixAt(i, m);
    }
    const holder = new THREE.Group();
    holder.add(ticks);
    holder.position.z = -0.4;
    dial.add(holder);
    spinners.push({ obj: holder, speed: 0.02 });
  }
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(1.6, 0), new THREE.MeshBasicMaterial({ color: 0xeaf6ff }));
  scene.add(core);
  const coreShell = new THREE.Mesh(new THREE.OctahedronGeometry(2.3, 0),
    new THREE.MeshBasicMaterial({ color: 0x7fe0d0, wireframe: true, transparent: true, opacity: 0.6 }));
  scene.add(coreShell);

  const DOME_R = 13.5;
  for (const def of [
    { phi: 22, col: TEAL, alpha: 0.42, speed: 0.20, segs: [[0.05, 0.45], [0.55, 0.95]] },
    { phi: 44, col: INDIGO, alpha: 0.38, speed: -0.14, segs: [[0.15, 0.75]] },
    { phi: 66, col: VIOLET, alpha: 0.34, speed: 0.10, segs: [[0.0, 0.60]] },
    { phi: -22, col: INDIGO, alpha: 0.20, speed: -0.12, segs: [[0.10, 0.50]] },
    { phi: -44, col: VIOLET, alpha: 0.16, speed: 0.08, segs: [[0.30, 0.80]] },
  ]) {
    const phi = (def.phi * Math.PI) / 180;
    const holder = new THREE.Group();
    holder.position.z = DOME_R * Math.sin(phi);
    dial.add(holder);
    spinners.push({ obj: holder, speed: def.speed });
    const mat = new THREE.MeshBasicMaterial({ color: def.col.clone(), transparent: true, opacity: def.alpha });
    ringMats.push({ mat, base: def.col.clone(), alpha: def.alpha });
    const latR = DOME_R * Math.cos(phi);
    for (const [s0, s1] of def.segs) {
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(latR, 0.06, 8, 90, (s1 - s0) * TAU), mat);
      mesh.rotation.z = s0 * TAU;
      holder.add(mesh);
    }
  }
  const armilla = new THREE.Group();
  scene.add(armilla);
  const meridians = [];
  for (const [phase, speed, alpha] of [[0, 0.06, 0.32], [Math.PI / 2, -0.045, 0.26]]) {
    const holder = new THREE.Group();
    holder.rotation.y = phase;
    armilla.add(holder);
    meridians.push({ obj: holder, speed });
    const col = new THREE.Color(0xbfe0dc);
    const mat = new THREE.MeshBasicMaterial({ color: col.clone(), transparent: true, opacity: alpha });
    ringMats.push({ mat, base: col.clone(), alpha });
    holder.add(new THREE.Mesh(new THREE.TorusGeometry(DOME_R, 0.055, 8, 90, Math.PI), mat));
  }
  { // starfield
    const N = 700, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const v = new THREE.Vector3().randomDirection().multiplyScalar(rand(90, 220));
      pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfd6ff, size: 0.8, sizeAttenuation: true, transparent: true, opacity: 0.7 })));
  }

  /* god-ray radial blur post pass */
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rt.texture },
      uCenter: { value: new THREE.Vector2(0.5, 0.5) },
      uWeight: { value: 0.45 }, uDecay: { value: 0.94 }, uExposure: { value: 1.4 }, uThresh: { value: 0.30 },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      precision highp float; varying vec2 vUv;
      uniform sampler2D tDiffuse; uniform vec2 uCenter;
      uniform float uWeight; uniform float uDecay; uniform float uExposure; uniform float uThresh;
      const int COUNT = 40;
      void main(){
        vec2 delta = (vUv - uCenter) / float(COUNT);
        float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        vec2 s = vUv - delta * n;
        float illum = uWeight; vec3 acc = vec3(0.0);
        for (int i = 0; i < COUNT; i++) { s -= delta; acc += max(texture2D(tDiffuse, s).rgb - vec3(uThresh), vec3(0.0)) * illum; illum *= uDecay; }
        vec3 base = texture2D(tDiffuse, vUv).rgb;
        vec3 col = base + acc * (uExposure / float(COUNT));
        col = col / (1.0 + col * 0.35);
        col += (n - 0.5) * 0.008;
        gl_FragColor = vec4(col, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    renderer.setSize(W, H, false);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    camera.aspect = W / H; camera.updateProjectionMatrix();
    rt.setSize(Math.round(W * DPR), Math.round(H * DPR));
  }
  window.addEventListener("resize", resize);

  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener("pointermove", (e) => { pointer.tx = (e.clientX / W) * 2 - 1; pointer.ty = (e.clientY / H) * 2 - 1; });

  /* ---- audio-reactive level ---- */
  let level = 0, targetLevel = 0, idlePhase = 0, accentActive = false, orbitTheta = 0;
  const SPEAKING_BASELINE = 0.12;

  /* ---- camera motion(固定値。手動調整UIは削除済み) ---- */
  const CAM_DEFAULTS = { speed: 0.2705, elev: 0.7679, sway: 0.1396, dist: 52 };
  const cam = { ...CAM_DEFAULTS };

  /* ---- oscilloscope ---- */
  const waveHistory = new Array(96).fill(0);
  function pushWave(v) { waveHistory.push(v); if (waveHistory.length > 96) waveHistory.shift(); }
  function drawWave() {
    const w = waveCanvas.clientWidth, h = waveCanvas.clientHeight;
    if (!w) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    if (waveCanvas.width !== w * d || waveCanvas.height !== h * d) { waveCanvas.width = w * d; waveCanvas.height = h * d; waveCtx.setTransform(d, 0, 0, d, 0, 0); }
    waveCtx.clearRect(0, 0, w, h);
    const hue = accentActive ? "231,195,131" : "127,224,208";
    const mid = h / 2;
    waveCtx.beginPath();
    waveHistory.forEach((v, i) => { const x = (i / (waveHistory.length - 1)) * w, y = mid - v * (h * 0.42); i === 0 ? waveCtx.moveTo(x, y) : waveCtx.lineTo(x, y); });
    waveCtx.strokeStyle = `rgba(${hue},0.8)`; waveCtx.lineWidth = 1.2;
    waveCtx.shadowColor = `rgba(${hue},0.7)`; waveCtx.shadowBlur = 5;
    waveCtx.stroke();
    waveCtx.strokeStyle = "rgba(220,232,238,0.08)"; waveCtx.lineWidth = 1; waveCtx.shadowBlur = 0;

  }

  /* ---- main loop ---- */
  const projected = new THREE.Vector3();
  let lastT = performance.now(), readoutTick = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t; idlePhase += dt;
    if (isSpeaking) targetLevel = lerp(targetLevel, SPEAKING_BASELINE, dt * 2.2);
    const idleTarget = isSpeaking || isMicActive || isStreaming ? targetLevel : 0.05 + 0.04 * Math.sin(idlePhase * 1.1);
    level = lerp(level, idleTarget, isMicActive ? 0.35 : (isSpeaking || isStreaming) ? 0.25 : 0.1);
    pushWave((Math.sin(idlePhase * 3.2) * 0.15 + level) * (0.7 + level * 0.6));
    if (isStreaming) targetLevel = Math.max(0, targetLevel - dt * 1.6);   // トークン間で減衰

    if (!REDUCED) {
      pointer.x = lerp(pointer.x, pointer.tx, 0.04);
      pointer.y = lerp(pointer.y, pointer.ty, 0.04);
      orbitTheta += dt * cam.speed * (1 + level * 1.4);
    }
    const az = orbitTheta + pointer.x * 0.35;
    const elev = cam.elev + Math.sin(t * 0.00007) * cam.sway - pointer.y * 0.10;
    camera.position.set(Math.sin(az) * Math.cos(elev) * cam.dist, Math.sin(elev) * cam.dist, Math.cos(az) * Math.cos(elev) * cam.dist);
    camera.lookAt(0, 0, 0);

    const swell = 1 + level * 0.10;
    dial.scale.setScalar(swell);
    armilla.scale.setScalar(swell);
    for (const s of spinners) s.obj.rotation.z += s.speed * dt * (1 + level * 0.8);
    for (const mer of meridians) mer.obj.rotation.y += mer.speed * dt * (1 + level * 0.8);
    for (const rm of ringMats) { rm.mat.color.copy(rm.base).multiplyScalar(0.8 + level * 1.6); rm.mat.opacity = clamp(rm.alpha + level * 0.25, 0, 1); }
    core.scale.setScalar(1 + level * 0.5);
    core.rotation.y += dt * 0.5; core.rotation.x += dt * 0.23;
    coreShell.scale.setScalar(1 + level * 0.65);
    coreShell.rotation.y -= dt * 0.3; coreShell.rotation.z += dt * 0.17;
    coreLight.intensity = 700 + level * 2600;

    postMat.uniforms.uWeight.value = 0.40 + level * 0.5;
    postMat.uniforms.uExposure.value = 1.3 + level * 3.6;
    postMat.uniforms.uThresh.value = 0.32 - level * 0.14;
    projected.set(0, 0, 0).project(camera);
    postMat.uniforms.uCenter.value.set((projected.x + 1) / 2, (projected.y + 1) / 2);

    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
    drawWave();

    readoutTick += dt;
    if (readoutTick > 0.08) { readoutTick = 0; levelReadoutEl.textContent = `LVL ${String(Math.round(level * 100)).padStart(3, "0")}`; }
    requestAnimationFrame(frame);
  }

  /* =================================================================
     claude-voice 結線 — 会話(SSE) / 音声 / TTS / MISSIONS / TASKS
     ================================================================= */
  const browserSessionId = "bs-radial-" + Math.random().toString(36).slice(2, 10);
  let CFG = window.CVIntent ? CVIntent.loadConfig() : { autoSendMs: 2000 };
  window.addEventListener("storage", (e) => { if (window.CVIntent && e.key === CVIntent.STORAGE_KEY) CFG = CVIntent.loadConfig(); });
  let projects = [], tasksAll = [], activeProject = null;
  let isStreaming = false;
  const classify = (t) => window.CVIntent ? CVIntent.classify(t, CFG, projects.map(p => p.name)) : { urgency: "normal", send: { triggered: false }, view: { action: "none" } };

  function setStatus(text, active, sysState) {
    statusEl.textContent = text;
    statusEl.classList.toggle("active", !!active);
    accentActive = !!active;
    if (sysState) sysLineEl.innerHTML = sysState;
  }
  function sysIdle() {
    const running = tasksAll.filter(t => t.status === "running").length;
    setStatus(listening ? "listening" : "standby", listening,
      `SYS.CV&nbsp;/&nbsp;JA-JP&nbsp;/&nbsp;${listening ? "LISTENING" : "IDLE"}${running ? `&nbsp;/&nbsp;RUN&nbsp;${running}` : ""}`);
  }

  /* ---- 会話ログ ---- */
  function addLine(role, text) {
    const div = document.createElement("div");
    div.className = "line " + role;
    const pfx = role === "user" ? "&gt;" : role === "assistant" ? "«" : "⚙";
    div.innerHTML = `<span class="pfx">${pfx}</span><span class="body"></span>`;
    div.querySelector(".body").textContent = text;
    logEl.appendChild(div);
    while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
    return div.querySelector(".body");
  }

  /* ---- chat (SSE) ---- */
  let activeChatAbort = null;
  const interruptChat = () => { if (activeChatAbort) activeChatAbort.abort(); };
  async function sendMessage(message) {
    const clean = String(message).trim();
    if (!clean) return;
    interruptChat();
    const controller = new AbortController();
    activeChatAbort = controller;
    addLine("user", clean);
    const body = addLine("assistant", "…");
    let first = true, finalText = "";
    isStreaming = true;
    btnSend.classList.add("on");
    setStatus("linking", true, "SYS.CV&nbsp;/&nbsp;JA-JP&nbsp;/&nbsp;THINKING");
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ browserSessionId, message: clean }), signal: controller.signal });
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
      const rd = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const blocks = buf.split("\n\n");
        buf = blocks.pop() ?? "";
        for (const bl of blocks) {
          const ev = /^event: (.*)$/m.exec(bl)?.[1], dr = /^data: (.*)$/m.exec(bl)?.[1];
          if (!ev || dr === undefined) continue;
          let d; try { d = JSON.parse(dr); } catch { continue; }
          if (ev === "delta") {
            if (first) { body.textContent = ""; first = false; }
            body.textContent += d.text;
            targetLevel = clamp(targetLevel + 0.22, 0, 0.9);   // トークンごとに光が脈打つ
            logEl.scrollTop = logEl.scrollHeight;
          } else if (ev === "directive") {
            if (d.detail) addLine("system", (d.ok ? "" : "! ") + d.detail);
            refreshData();
          } else if (ev === "done") { finalText = d.text || body.textContent; body.textContent = finalText; }
          else if (ev === "error") { body.textContent = "エラー: " + (d.message || ""); }
        }
      }
      if (finalText) speak(finalText);
      refreshData();
    } catch (err) {
      if (!controller.signal.aborted) body.textContent = "接続エラー: " + (err && err.message || err);
    } finally {
      isStreaming = false;
      btnSend.classList.remove("on");
      if (activeChatAbort === controller) { activeChatAbort = null; if (!isSpeaking) sysIdle(); }
    }
  }

  /* ---- dispatch queue(緊急は割り込み) + 発話→パネル同期 ---- */
  let queue = [], pumping = false;
  function enqueue(text) {
    syncView(text);
    const u = classify(text).urgency === "urgent";
    if (u) { const i = queue.findIndex(q => !q.u); i === -1 ? queue.push({ text, u }) : queue.splice(i, 0, { text, u }); interruptChat(); speechSynthesis.cancel(); }
    else queue.push({ text, u });
    pump();
  }
  async function pump() {
    if (pumping) return;
    pumping = true;
    try { while (queue.length) { const it = queue.shift(); await sendMessage(it.text); } }
    finally { pumping = false; }
  }
  function syncView(text) {
    const v = classify(text).view;
    if (v.action === "task") {
      const t = tasksAll.find(x => Number(x.seq) === Number(v.seq));
      if (t) { selectedTaskId = t.id; renderTasks(true); void loadDetail(t.id); flashPanel("panel-tasks"); }
    } else if (v.action === "project") { switchProject(v.project); flashPanel("panel-projects"); }
    else if (v.action === "collapse") { selectedTaskId = null; renderTasks(true); }
  }

  /* ---- TTS ---- */
  let ttsOn = true, isSpeaking = false, lastBoundaryAt = 0, fallbackPulseTimer = null;
  btnTts.addEventListener("click", () => { ttsOn = !ttsOn; btnTts.classList.toggle("on", ttsOn); if (!ttsOn) speechSynthesis.cancel(); });
  function clip(t) { const s = String(t); if (s.length <= 220) return s; const c = s.slice(0, 220), p = Math.max(c.lastIndexOf("。"), c.lastIndexOf("."), c.lastIndexOf("\n")); return (p > 60 ? c.slice(0, p + 1) : c) + " 以下略"; }
  function speak(text) {
    if (!ttsOn || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(clip(text));
    utter.lang = "ja-JP";
    utter.rate = 1.15;
    utter.onstart = () => {
      isSpeaking = true;
      targetLevel = 0.32;
      setStatus("speaking", true, "SYS.CV&nbsp;/&nbsp;JA-JP&nbsp;/&nbsp;SPEAKING");
      clearInterval(fallbackPulseTimer);
      fallbackPulseTimer = setInterval(() => { if (performance.now() - lastBoundaryAt > 420) targetLevel = clamp(targetLevel + 0.35, 0, 1); }, 260);
    };
    utter.onboundary = () => { lastBoundaryAt = performance.now(); targetLevel = clamp(0.55 + Math.random() * 0.35, 0, 1); };
    utter.onend = utter.onerror = () => { isSpeaking = false; targetLevel = 0; clearInterval(fallbackPulseTimer); sysIdle(); };
    speechSynthesis.speak(utter);
  }

  /* ---- マイク: 音声認識 + 実振幅(RMS)でコアを駆動 ---- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, silenceTimer = null;
  let audioCtx = null, analyser = null, micStream = null, micRaf = null, smoothedVol = 0;
  let isMicActive = false;
  async function startLevelMeter() {
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return; }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    isMicActive = true;
    const buf = new Uint8Array(analyser.fftSize);
    const tick = () => {
      if (!isMicActive) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      smoothedVol = lerp(smoothedVol, clamp(Math.sqrt(sum / buf.length) * 4.5, 0, 1), 0.4);
      if (!isSpeaking && !isStreaming) targetLevel = smoothedVol;
      micRaf = requestAnimationFrame(tick);
    };
    tick();
  }
  function stopLevelMeter() {
    isMicActive = false;
    cancelAnimationFrame(micRaf);
    if (micStream) micStream.getTracks().forEach(tr => tr.stop());
    if (audioCtx) audioCtx.close();
    micStream = null; audioCtx = null; analyser = null;
    if (!isSpeaking && !isStreaming) targetLevel = 0;
  }
  function detectSendCmd(text) { const s = classify(text).send; return s && s.triggered ? s.body : null; }
  function armAutoSend() {
    if (silenceTimer) clearTimeout(silenceTimer);
    if (cmdEl.value.trim()) silenceTimer = setTimeout(() => { const v = cmdEl.value.trim(); cmdEl.value = ""; autoGrow(); if (v) enqueue(v); }, CFG.autoSendMs || 2000);
  }
  function startRec() {
    if (!SR) { addLine("system", "! このブラウザは音声認識非対応です(Chrome推奨)"); return; }
    rec = new SR();
    rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = "", finals = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; r.isFinal ? finals += r[0].transcript : interim += r[0].transcript; }
      if (speechSynthesis.speaking && finals.trim()) speechSynthesis.cancel();
      if (finals) { cmdEl.value = (cmdEl.value + finals).trim(); autoGrow(); }
      interimEl.textContent = interim;
      const body = detectSendCmd(cmdEl.value + interim);
      if (body) { if (silenceTimer) clearTimeout(silenceTimer); cmdEl.value = ""; interimEl.textContent = ""; autoGrow(); enqueue(body); return; }
      if (finals) armAutoSend();
    };
    rec.onend = () => { if (listening) { try { rec.start(); } catch (e) {} } };
    rec.onerror = () => {};
    try { rec.start(); } catch (e) { return; }
    listening = true;
    btnMic.classList.add("on");
    startLevelMeter();
    setStatus("listening", true, "SYS.CV&nbsp;/&nbsp;LIVE&nbsp;/&nbsp;LISTENING");
  }
  function stopRec() {
    listening = false;
    if (rec) { try { rec.stop(); } catch (e) {} }
    btnMic.classList.remove("on");
    interimEl.textContent = "";
    stopLevelMeter();
    sysIdle();
  }
  btnMic.addEventListener("click", () => listening ? stopRec() : startRec());

  /* ---- テキスト入力 ---- */
  function autoGrow() { cmdEl.style.height = "auto"; cmdEl.style.height = cmdEl.scrollHeight + "px"; }
  cmdEl.addEventListener("input", autoGrow);
  cmdEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      const v = cmdEl.value.trim();
      if (v) { speechSynthesis.cancel(); cmdEl.value = ""; autoGrow(); enqueue(v); }
    }
  });
  btnSend.addEventListener("click", () => { const v = cmdEl.value.trim(); if (v) { speechSynthesis.cancel(); cmdEl.value = ""; autoGrow(); enqueue(v); } });
  btnStop.addEventListener("click", () => {
    speechSynthesis.cancel();
    isSpeaking = false;
    clearInterval(fallbackPulseTimer);
    interruptChat();
    queue = [];
    targetLevel = 0;
    sysIdle();
  });

  /* ---- PROJECTS / TASKS パネル ----------------------------------------
     前の claude-voice のタスクUXをこの意匠で継承: 詳細展開・追加指示・
     引き継ぎ・中止・新規タスク追加・要対応(未確認の完了/失敗)・完了アナウンス。
     差分描画で「押す瞬間にDOMが差し替わる」事故を防ぐ。 ------------------- */
  const acked = new Set((() => { try { return JSON.parse(localStorage.getItem("radial-acked") || "[]"); } catch (e) { return []; } })());
  const saveAcked = () => { try { localStorage.setItem("radial-acked", JSON.stringify([...acked])); } catch (e) {} };
  const detailsCache = {};
  let selectedTaskId = null;
  const prevStatus = new Map();
  let projSig = "", taskSig = "";
  const STATUS_JA = { queued: "待機", running: "実行中", succeeded: "完了", failed: "失敗", cancelled: "中止" };
  const ST_MARK = { running: "●", queued: "◌", succeeded: "✓", failed: "✕", cancelled: "⊘" };
  const timeAgo = (ts) => { if (!ts) return ""; const s = (Date.now() - ts) / 1000 | 0; if (s < 60) return "たった今"; const m = s / 60 | 0; if (m < 60) return m + "分前"; const h = m / 60 | 0; if (h < 24) return h + "時間前"; return (h / 24 | 0) + "日前"; };
  function flashPanel(id) { const el = document.getElementById(id); if (!el) return; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 950); }

  async function refreshData() {
    try {
      const [pr, tr] = await Promise.all([
        fetch(`/api/projects?all=1&browserSessionId=${browserSessionId}`),
        fetch("/api/tasks"),
      ]);
      const pj = await pr.json(), tj = await tr.json();
      activeProject = pj.active ?? activeProject;
      tasksAll = Array.isArray(tj.tasks) ? tj.tasks : [];
      const withTasks = [...new Set(tasksAll.map(t => t.project))];
      let names = withTasks.slice();
      if (activeProject && !names.includes(activeProject)) names.unshift(activeProject);
      if (Array.isArray(pj.projects)) for (const p of pj.projects) { if (names.length >= 8) break; if (!names.includes(p.name)) names.push(p.name); }
      projects = names.map(name => {
        const ts = tasksAll.filter(t => t.project === name);
        return { name, running: ts.filter(t => t.status === "running" || t.status === "queued").length, done: ts.filter(t => t.status === "succeeded").length, total: ts.length };
      });
      // 完了アナウンス(前のUXを継承): 実行中→終了 の遷移をログと声で知らせる
      for (const t of tasksAll) {
        const before = prevStatus.get(t.id);
        if (before && before !== t.status && (before === "running" || before === "queued") &&
            (t.status === "succeeded" || t.status === "failed" || t.status === "cancelled")) {
          const head = t.status === "succeeded" ? `タスク #${t.seq} が完了しました` :
                       t.status === "failed" ? `タスク #${t.seq} が失敗しました` : `タスク #${t.seq} を中止しました`;
          addLine("system", `${head}${t.result || t.error ? ": " + String(t.result || t.error).slice(0, 140) : ""}`);
          // 緊急は読み上げ中でも割り込んで伝える。通常は会話読み上げを潰さない
          if (t.status !== "cancelled" && (t.priority === "urgent" || !isSpeaking)) speak(`${t.priority === "urgent" ? "緊急タスク。" : ""}${head}`);
          flashPanel("panel-tasks");
        }
        prevStatus.set(t.id, t.status);
      }
      if (selectedTaskId && !tasksAll.find(t => t.id === selectedTaskId)) selectedTaskId = null;
      renderProjects();
      renderTasks();
      const sel = tasksAll.find(t => t.id === selectedTaskId);
      if (sel && sel.status === "running") void loadDetail(sel.id);
      if (!isSpeaking && !isStreaming) sysIdle();
    } catch (e) {}
  }
  async function loadDetail(id) {
    try {
      const r = await fetch(`/api/tasks/${id}`);
      const j = await r.json();
      detailsCache[id] = { events: j.events || [], liveText: j.liveText || null };
      if (selectedTaskId === id) renderTasks(true);
    } catch (e) {}
  }

  function renderProjects() {
    const sig = activeProject + "|" + projects.map(p => `${p.name}:${p.running}:${p.done}:${p.total}`).join(",");
    if (sig === projSig) return;
    projSig = sig;
    const box = $("#projects-list");
    box.innerHTML = "";
    if (!projects.length) { box.innerHTML = `<p class="none">NO PROJECTS</p>`; return; }
    projects.forEach(p => {
      const b = document.createElement("button");
      b.className = `prj ${p.running ? "run" : ""} ${p.name === activeProject ? "active" : ""}`;
      b.innerHTML = `<span class="mk"></span><span class="nm">${esc(p.name)}</span><span class="ct">${p.running ? "RUN " + p.running : p.total ? p.done + "/" + p.total : ""}</span>`;
      b.addEventListener("click", () => switchProject(p.name));
      box.appendChild(b);
    });
  }

  const rank = (t) => t.status === "running" ? 0 : t.status === "queued" ? 1 : 2;
  function renderTasks(force) {
    const panel = $("#panel-tasks");
    const list = tasksAll.slice().sort((a, b) => rank(a) - rank(b) || (b.startedAt - a.startedAt)).slice(0, 12);
    const det = selectedTaskId ? detailsCache[selectedTaskId] : null;
    const sig = selectedTaskId + "|" + acked.size + "|" + (det ? (det.liveText || "").length + ":" + det.events.length : "") + "|" +
      list.map(t => `${t.id}:${t.status}:${(t.result || t.error || "").length}`).join(",");
    if (!force && sig === taskSig) return;
    // 入力中(追加指示・新規タスク)は再描画で入力欄を消さない
    if (!force && panel.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
    taskSig = sig;
    const box = $("#tasks-list");
    box.innerHTML = "";
    if (!list.length) { box.innerHTML = `<p class="none">NO TASKS — ＋で追加、または話しかけてください</p>`; return; }
    list.forEach(t => box.appendChild(taskRow(t)));
  }
  function taskRow(t) {
    const sel = t.id === selectedTaskId;
    const review = (t.status === "succeeded" || t.status === "failed") && !acked.has(t.id);
    const row = document.createElement("div");
    row.className = `tk ${sel ? "sel" : ""}`;
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.innerHTML = `<div class="tk-row"><span class="st ${t.status}">${ST_MARK[t.status] || "·"}</span><span class="seq">#${t.seq ?? ""}</span><span class="ti">${esc(t.instruction)}</span>${t.priority === "urgent" ? '<span class="urg">緊急</span>' : ""}${review ? '<span class="rev" title="要対応(未確認)"></span>' : ""}</div>`;
    if (sel) row.appendChild(taskDetail(t));
    row.addEventListener("click", (e) => {
      if (e.target.closest(".tbtn") || e.target.closest(".tform")) return;
      if (review) { acked.add(t.id); saveAcked(); }
      selectedTaskId = sel ? null : t.id;
      renderTasks(true);
      if (!sel) void loadDetail(t.id);
    });
    row.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === row) { e.preventDefault(); row.click(); } });
    return row;
  }
  function taskDetail(t) {
    const det = detailsCache[t.id];
    const out = t.status === "running" ? (det && det.liveText) || t.lastEvent || "実行中…" : t.result || t.error || "（出力はありません）";
    const tools = det ? det.events.filter(e => e.kind === "tool").slice(-3) : [];
    const d = document.createElement("div");
    d.className = "tkd";
    const acts = [];
    if (t.status === "running") acts.push(`<button class="tbtn" data-a="instruct">追加指示</button>`, `<button class="tbtn danger" data-a="cancel">中止</button>`);
    else if (t.status === "queued") acts.push(`<button class="tbtn danger" data-a="cancel">取り下げ</button>`);
    else if (t.sessionId) acts.push(`<button class="tbtn" data-a="resume">引き継いで依頼</button>`);
    d.innerHTML = `<p class="meta">[${STATUS_JA[t.status] || t.status}]${t.priority === "urgent" ? " 緊急" : ""} ${esc(t.project)} · ${timeAgo(t.endedAt || t.startedAt)}${t.branch ? " · " + esc(t.branch) : ""}</p>
      <p class="out">${esc(out)}</p>
      ${tools.length ? `<div class="tools">${tools.map(e => `<span>⚙ ${esc(e.text)}</span>`).join("")}</div>` : ""}
      ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}
      <div class="slot"></div>`;
    d.querySelectorAll(".tbtn").forEach(b => b.addEventListener("click", (e) => { e.stopPropagation(); taskAction(t, b.dataset.a, d); }));
    return d;
  }
  async function taskAction(t, a, d) {
    if (a === "cancel") {
      await fetch(`/api/tasks/${t.id}/cancel`, { method: "POST", headers: { "content-type": "application/json" } }).catch(() => {});
      addLine("system", `タスク #${t.seq} を中止`);
      refreshData();
      return;
    }
    const slot = d.querySelector(".slot");
    const isResume = a === "resume";
    slot.innerHTML = `<div class="tform"><input placeholder="${isResume ? "引き継いで何をしますか？ (Enter)" : "追加の指示… (Enter)"}"></div>`;
    const inp = slot.querySelector("input");
    inp.focus();
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      e.preventDefault();
      const v = inp.value.trim();
      if (!v) return;
      if (isResume) {
        await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ browserSessionId, resume: t.id, instruction: v }) }).catch(() => {});
        addLine("system", `#${t.seq} を引き継いで開始: ${v.slice(0, 60)}`);
      } else {
        await fetch(`/api/tasks/${t.id}/instructions`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: v }) }).catch(() => {});
        addLine("system", `#${t.seq} に追加指示: ${v.slice(0, 60)}`);
      }
      refreshData();
    });
  }

  /* 新規タスクの追加(＋): 実行中プロジェクトに直接タスクを起動する */
  $("#task-add").addEventListener("click", () => {
    const wrap = $("#newtask");
    wrap.classList.toggle("show");
    if (wrap.classList.contains("show")) wrap.querySelector("input").focus();
  });
  $("#newtask input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();
    const v = e.target.value.trim();
    if (!v) return;
    e.target.value = "";
    $("#newtask").classList.remove("show");
    try {
      // セッション未選択でも、表示中の先頭プロジェクト(タスクを持つ順)へ入れる
      const target = activeProject || (projects[0] && projects[0].name);
      const res = await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ browserSessionId, instruction: v, ...(target ? { project: target } : {}) }) });
      const j = await res.json().catch(() => ({}));
      if (res.ok) { addLine("system", `タスク #${j.seq ?? "?"} を開始: ${v.slice(0, 60)}`); flashPanel("panel-tasks"); }
      else addLine("system", `! ${j.error || "タスクを開始できませんでした"}`);
    } catch (err) { addLine("system", "! タスクを開始できませんでした"); }
    refreshData();
  });

  async function switchProject(name) {
    if (name === activeProject) return;
    activeProject = name;
    projSig = "";
    renderProjects();
    try { await fetch("/api/workspace", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ browserSessionId, project: name }) }); } catch (e) {}
    addLine("system", `PROJECT → ${name}`);
    refreshData();
  }

  /* ---- 起動 ---- */
  (async function init() {
    try {
      const h = await (await fetch("/api/health")).json();
      addLine("system", h.mode === "cli" ? "CLAUDE CODE LINK ESTABLISHED" : `MODE: ${h.mode}`);
    } catch (e) { addLine("system", "! API OFFLINE"); }
    await refreshData();
    setInterval(refreshData, 3000);
  })();

  resize();
  requestAnimationFrame(frame);
  </script>
</body>
</html>
